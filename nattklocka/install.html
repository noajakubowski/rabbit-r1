<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installera Nattklocka</title>
<style>
  body { margin: 0; min-height: 100vh; background: #0b0603; color: #ffb27a; font: 15px/1.55 -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  h1 { font-weight: 300; font-size: 30px; margin: 0 0 4px; color: #ff8a3d; }
  p { margin: 0 0 18px; color: rgba(255,178,122,0.7); max-width: 380px; }
  #qr { background: #fff; padding: 16px; border-radius: 12px; }
  a { color: #ff8a3d; }
  .small { font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
  <h1>Nattklocka</h1>
  <p>Öppna <b>creations</b> på din R1, välj att lägga till via QR och skanna koden.</p>
  <div id="qr"></div>
  <p class="small">Test: <a id="testlink" href="./?test=1" target="_blank">öppna med alarm om 1 minut</a></p>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  var url = new URL('./?v=1', location.href).href;
  var payload = JSON.stringify({ title: 'Nattklocka', url: url, description: 'Klocka med alarm som väcker med Sveriges Radio', iconUrl: '', themeColor: '#FF8A3D' });
  var qr = qrcode(0, 'M');
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  qr.addData(payload, 'Byte'); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: Math.max(3, Math.floor(300 / qr.getModuleCount())), margin: 0, scalable: false });
</script>
</body>
</html>
